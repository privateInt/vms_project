# Disposable Linux filesystem check only. No production mounts or DB service.
services:
  admission-prepare:
    image: golang:1.27.1-bookworm
    working_dir: /work
    environment:
      GOTOOLCHAIN: local
    volumes:
      - ../platform:/source:ro
      - authority:/authority
      - exchange:/exchange
  admission-runtime:
    image: golang:1.27.1-bookworm
    user: "10001:10001"
    working_dir: /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    volumes:
      - authority:/authority:ro
      - exchange:/exchange:ro
    environment:
      VMS_ADMISSION_NATIVE_PHASE: read
volumes:
  authority: {}
  exchange: {}
