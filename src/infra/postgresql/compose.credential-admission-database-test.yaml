# Disposable schema 9 verification; no published ports or production paths.
services:
  admission-db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: vms_camera_test
      POSTGRES_USER: vms_camera_test
      POSTGRES_PASSWORD: "${VMS_ADMISSION_DB_TEST_PASSWORD:?isolated runner required}"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - exchange:/exchange
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vms_camera_test -d vms_camera_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  admission-build:
    image: golang:1.27.1-bookworm
    working_dir: /work
    volumes:
      - ../../platform:/source:ro
      - exchange:/exchange
    environment:
      CAMERA_TEST_DATABASE_URL: "postgres://vms_camera_test:${VMS_ADMISSION_DB_TEST_PASSWORD:?isolated runner required}@admission-db:5432/vms_camera_test?sslmode=disable"
      CAMERA_TEST_ALLOW_SCHEMA_RESET: "1"
      GOTOOLCHAIN: local
    depends_on:
      admission-db:
        condition: service_healthy
volumes:
  exchange: {}
