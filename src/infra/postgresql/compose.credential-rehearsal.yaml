# Disposable DB/key restore rehearsal. No production networks, ports or data.
services:
  rehearsal-db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: vms_camera_test
      POSTGRES_USER: vms_camera_test
      POSTGRES_PASSWORD: "${VMS_REHEARSAL_PASSWORD:?isolated runner required}"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - database-backup:/rehearsal-backup
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vms_camera_test -d vms_camera_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  rehearsal-prepare:
    image: golang:1.27.1-bookworm
    working_dir: /work
    environment:
      GOTOOLCHAIN: local
    volumes:
      - ../../platform:/source:ro
      - type: bind
        source: "${VMS_REHEARSAL_INPUT:?isolated synthetic input required}"
        target: /synthetic
        read_only: true
        bind:
          create_host_path: false
      - keys:/keys
      - key-backup:/backup-keys
      - exchange:/exchange
  rehearsal-check:
    image: golang:1.27.1-bookworm
    user: "10001:10001"
    working_dir: /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    volumes:
      - keys:/keys:ro
      - key-backup:/backup-keys:ro
      - exchange:/exchange
    environment:
      CAMERA_TEST_DATABASE_URL: "postgres://vms_camera_test:${VMS_REHEARSAL_PASSWORD:?isolated runner required}@rehearsal-db:5432/${VMS_REHEARSAL_DATABASE:-vms_camera_test}?sslmode=disable"
      CAMERA_TEST_ROLE_PASSWORD: "${VMS_REHEARSAL_ROLE_PASSWORD:?isolated runner required}"
      CAMERA_CREDENTIAL_REHEARSAL_ONLY: "1"
    depends_on:
      rehearsal-db:
        condition: service_healthy
volumes:
  keys: {}
  key-backup: {}
  exchange: {}
  database-backup: {}
