# Actual admitted management HTTP; disposable synthetic inputs, no host ports.
services:
  bindings-build:
    image: golang:1.27.1-bookworm
    working_dir: /work
    volumes:
      - ../../platform:/source:ro
      - exchange:/exchange
    environment:
      CAMERA_TEST_DATABASE_URL: "postgres://vms_camera_test:${VMS_BINDINGS_TEST_PASSWORD:?isolated runner required}@bindings-db:5432/vms_camera_test?sslmode=disable"
      CAMERA_TEST_ALLOW_SCHEMA_RESET: "1"
      GOTOOLCHAIN: local
  bindings-owner:
    image: postgres:17.11-bookworm
    volumes:
      - exchange:/exchange
  bindings-db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: vms_camera_test
      POSTGRES_USER: vms_camera_test
      POSTGRES_PASSWORD: "${VMS_BINDINGS_TEST_PASSWORD:?isolated runner required}"
    command: [postgres, -c, ssl=on, -c, ssl_min_protocol_version=TLSv1.2, -c, ssl_cert_file=/exchange/fixture/tls/server.crt, -c, ssl_key_file=/exchange/fixture/tls/server.key]
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - exchange:/exchange:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vms_camera_test -d vms_camera_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  management-owner:
    image: golang:1.27.1-bookworm
    working_dir: /tmp
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - exchange:/exchange:ro
      - control:/control-rw
      - control:/control-ro:ro
    environment:
      CAMERA_TEST_DATABASE_URL: "postgres://vms_camera_test:${VMS_BINDINGS_TEST_PASSWORD:?isolated runner required}@bindings-db:5432/vms_camera_test?sslmode=disable"
      CAMERA_TEST_ALLOW_SCHEMA_RESET: "1"
      CAMERA_MANAGEMENT_TEST_PHASE: owner
    depends_on:
      bindings-db:
        condition: service_healthy
volumes:
  exchange: {}
  control: {}
