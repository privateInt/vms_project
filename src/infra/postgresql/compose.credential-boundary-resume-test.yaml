# Disposable restored candidate runtime resume, synthetic secrets only.
services:
  boundary-build:
    image: golang:1.27.1-bookworm
    working_dir: /work
    volumes:
      - ../../platform:/source:ro
      - exchange:/exchange
    environment:
      CAMERA_TEST_DATABASE_URL: "postgres://vms_camera_test:${VMS_BOUNDARY_TEST_PASSWORD:?isolated runner required}@boundary-db:5432/vms_camera_test?sslmode=disable"
      CAMERA_TEST_ALLOW_SCHEMA_RESET: "1"
      CAMERA_BOUNDARY_BASE: /exchange/boundary
      GOTOOLCHAIN: local
  boundary-files-owner:
    image: postgres:17.11-bookworm
    volumes:
      - exchange:/exchange
      - socket:/var/run/postgresql
  boundary-db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: vms_camera_test
      POSTGRES_USER: vms_camera_test
      POSTGRES_PASSWORD: "${VMS_BOUNDARY_TEST_PASSWORD:?isolated runner required}"
    command: [postgres, -c, ssl=on, -c, ssl_min_protocol_version=TLSv1.2, -c, ssl_cert_file=/exchange/boundary/tls/server.crt, -c, ssl_key_file=/exchange/boundary/tls/server.key, -c, ssl_ca_file=/exchange/boundary/tls/ca.crt, -c, hba_file=/exchange/boundary/hba/pg_hba.conf, -c, unix_socket_directories=/var/run/postgresql, -c, max_prepared_transactions=20]
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - exchange:/exchange:ro
      - socket:/var/run/postgresql
    # Initialization uses a socket-only temporary server. Wait for final TCP startup.
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U vms_camera_test -d vms_camera_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  boundary-owner:
    image: postgres:17.11-bookworm
    working_dir: /tmp
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=0700
    volumes:
      - exchange:/exchange
      - socket:/var/run/postgresql:ro
    environment:
      CAMERA_TEST_DATABASE_URL: "postgres://vms_camera_test:${VMS_BOUNDARY_TEST_PASSWORD:?isolated runner required}@boundary-db:5432/vms_camera_test?sslmode=disable"
      CAMERA_TEST_ALLOW_SCHEMA_RESET: "1"
      CAMERA_BOUNDARY_BASE: /exchange/boundary
      CAMERA_BOUNDARY_SOCKET: /var/run/postgresql
      CAMERA_BOUNDARY_RESTORE_ONLY: "1"
      CAMERA_BOUNDARY_RESUME_ONLY: "1"
    # Stable container IP across separate verification processes.
    entrypoint: [sleep, infinity]
    depends_on:
      boundary-db:
        condition: service_healthy
  boundary-client:
    image: golang:1.27.1-bookworm
    user: "10001:10001"
    working_dir: /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    volumes:
      - exchange:/exchange:ro
    environment:
      CAMERA_TEST_ALLOW_SCHEMA_RESET: "1"
      CAMERA_BOUNDARY_BASE: /exchange/boundary
      CAMERA_BOUNDARY_PHASE: client
    entrypoint: [sleep, infinity]
volumes:
  exchange: {}
  socket: {}
